	<defs>
		<linearGradient id="mmac-ember-app" x1="40" y1="34" x2="88" y2="96" gradientUnits="userSpaceOnUse">
			<stop stop-color="#3fb950"/>
			<stop offset=".62" stop-color="#2ea043"/>
			<stop offset="1" stop-color="#e8562d"/>
		</linearGradient>
		<linearGradient id="mmac-ground" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
			<stop stop-color="#161b22"/>
			<stop offset="1" stop-color="#0d1117"/>
		</linearGradient>
	</defs>
	<rect x="8" y="8" width="112" height="112" rx="26" fill="url(#mmac-ground)"/>
	<rect x="8.5" y="8.5" width="111" height="111" rx="25.5" stroke="#2ea043" stroke-opacity=".28"/>
	<path d="M42 90 V44 Q42 39 47 42 L64 71 L81 42 Q86 39 86 44 V90" stroke="url(#mmac-ember-app)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
